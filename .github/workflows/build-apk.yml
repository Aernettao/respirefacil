name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar web (www/)
        run: npm run prepare:www

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones do app
        run: npx capacitor-assets generate --android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk respire-facil.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: respire-facil-apk
          path: respire-facil.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Respire Fácil (última versão)
          files: respire-facil.apk

<style>
  :root{ --ink:#1b1b3a; --muted:#5d6180; --bg:#f4f8ff; --card:#ffffff; }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#f2f3ff; --muted:#b4b8d6; --bg:#14152b; --card:#1f2040; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(131,58,180,.14), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(247,119,55,.12), transparent 55%),
      var(--bg);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom));
  }
  .card{
    width:100%; max-width:420px; background:var(--card); border-radius:28px; padding:34px 26px 28px;
    text-align:center; box-shadow:0 24px 60px rgba(60,40,120,.16);
  }
  .logo{ width:96px; height:96px; border-radius:22px; display:block; margin:0 auto 18px; box-shadow:0 8px 20px rgba(60,40,120,.18); }
  h1{ font-size:24px; line-height:1.2; margin:0 0 12px; letter-spacing:-0.01em; }
  p{ font-size:16px; line-height:1.55; margin:0 0 12px; color:var(--muted); }
  .small{ font-size:13px; margin:18px 0 0; }
  [hidden]{ display:none !important; }
</style>
</head>

<script>
(function(){
  var hash = window.location.hash || '';
  var search = window.location.search || '';
  var h = new URLSearchParams(hash.replace(/^#/, ''));
  var q = new URLSearchParams(search);
  var type = h.get('type') || q.get('type') || '';

  // Link de "esqueci minha senha": leva para o app (versão web) para criar a nova senha.
  if (type === 'recovery') {
    window.location.replace('/' + search + hash);
    return;
  }

  var hasError = h.get('error') || h.get('error_code') || q.get('error') || q.get('error_code');
  document.getElementById(hasError ? 'erro' : 'ok').hidden = false;

  // Tira códigos da barra de endereço (não são necessários aqui).
  try { window.history.replaceState(null, '', window.location.pathname); } catch (e) {}
})();
</script>
